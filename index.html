<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prima Donna Hair Beauty | Parrucchiera a Roma, Zona Ponte di Nona</title>
<meta name="description" content="Salone di parrucchiere a Roma, Zona Ponte di Nona. Balayage, colore, taglio uomo e donna, unghie.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💇</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <a class="mark" href="#top">Prima Donna <span>Hair Beauty</span></a>
  <nav aria-label="Main">
    <a href="#servizi" data-it="Servizi" data-en="Services"></a>
    <a href="#galleria" data-it="Galleria" data-en="Gallery"></a>
    <a href="#contatti" data-it="Contatti" data-en="Contact"></a>
  </nav>
  <button class="lang" id="lb" type="button" aria-label="Cambia lingua / Change language">EN</button>
</header>

<main id="top">
<section class="hero">
  <div class="hero-photo"><img src="images/balayage-long.jpg" alt="Long blonde balayage hair styled in loose waves"></div>
  <div class="hero-text">
    <p class="kicker" data-it="ZONA PONTE DI NONA · ROMA" data-en="PONTE DI NONA AREA · ROME"></p>
    <h1 data-it="Prima Donna Hair Beauty" data-en="Prima Donna Hair Beauty"></h1>
    <p class="lede" data-it="Parrucchiera, balayage, taglio uomo e unghie, nel cuore di Ponte di Nona." data-en="Hair salon, balayage, men's cuts and nails, in the heart of Ponte di Nona."></p>
    <div class="cta">
      <a class="btn" href="tel:+390622181648" data-it="Chiama il salone" data-en="Call the salon"></a>
      <a class="btn alt" href="#contatti" data-it="Prenota" data-en="Book now"></a>
    </div>
  </div>
</section>

<section id="servizi" class="servizi">
  <h2 data-it="I nostri servizi" data-en="Our services"></h2>
  <div class="rule"></div>
  <div class="grid3">
    <article><img src="images/red-waves.jpg" alt="Copper balayage waves"><h3 data-it="Colore &amp; Balayage" data-en="Color &amp; Balayage"></h3><p data-it="Schiariture, tecniche balayage e colore su misura per te." data-en="Highlights, balayage techniques and color tailored to you."></p></article>
    <article><img src="images/short-bob.jpg" alt="Short styled haircut and blowout"><h3 data-it="Taglio &amp; Piega" data-en="Cut &amp; Style"></h3><p data-it="Tagli donna e uomo, pieghe per ogni occasione." data-en="Women's and men's cuts, blowouts for every occasion."></p></article>
    <article><img src="images/pink-hair.jpg" alt="Vivid pink hair color"><h3 data-it="Colori Fantasia" data-en="Fashion Colors"></h3><p data-it="Tonalità vivaci e fuori dagli schemi, per chi ama osare." data-en="Bold, statement colors for anyone who loves to stand out."></p></article>
    <article><img src="images/undercut.jpg" alt="Undercut style haircut"><h3 data-it="Uomo" data-en="Men"></h3><p data-it="Cambio look, undercut e sfumature su misura." data-en="New looks, undercuts and precision fades."></p></article>
    <article><img src="images/superluminoso.jpg" alt="Bright blonde balayage on curly hair"><h3 data-it="Trattamenti" data-en="Treatments"></h3><p data-it="Trattamenti superluminosi per un effetto naturale e sano." data-en="Brightening treatments for a healthy, natural finish."></p></article>
    <article class="nails"><h3 data-it="Unghie" data-en="Nails"></h3><p data-it="Manicure e nail art per completare il tuo look." data-en="Manicure and nail art to complete your look."></p></article>
  </div>
</section>

<section id="galleria" class="galleria">
  <h2 data-it="Galleria" data-en="Gallery"></h2>
  <div class="rule"></div>
  <p class="sub" data-it="Alcuni dei nostri lavori più recenti. Seguici su Instagram per vederli tutti." data-en="A few of our recent looks. Follow us on Instagram to see them all."></p>
  <div class="gal" id="gallery">
    <img src="images/red-bob.jpg" alt="Copper red hair with fringe">
    <img src="images/red-curls.jpg" alt="Copper red curls">
    <img src="images/blonde-back.jpg" alt="Long blonde balayage from the back">
    <img src="images/blonde-wavy-back.jpg" alt="Blonde wavy balayage from the back">
    <img src="images/clients-smiling.jpg" alt="Two smiling clients at the salon">
    <img src="images/blonde-back2.jpg" alt="Long blonde balayage waves">
  </div>
  <a class="btn alt" href="https://www.instagram.com/prima_donna_hairbeauty/" target="_blank" rel="noopener" data-it="Vedi tutte le foto" data-en="See all photos"></a>
</section>

<section id="contatti" class="contatti">
  <div class="info">
    <h2 data-it="Vieni a trovarci" data-en="Come visit us"></h2>
    <div class="rule"></div>
    <ul>
      <li><b data-it="Indirizzo" data-en="Address"></b>Via Matteo Trucco 196, Roma 00132<br><span data-it="Zona Ponte di Nona" data-en="Ponte di Nona area"></span></li>
      <li><b data-it="Telefono" data-en="Phone"></b><a href="tel:+390622181648">06 2218 1648</a> &middot; <a href="tel:+393519009774">351 900 9774</a></li>
      <li><b data-it="Social" data-en="Social"></b><a href="https://www.instagram.com/prima_donna_hairbeauty/" target="_blank" rel="noopener">@prima_donna_hairbeauty</a></li>
    </ul>
  </div>
  <form id="form">
    <h3 data-it="Richiedi un appuntamento" data-en="Request an appointment"></h3>
    <label><span data-it="Nome" data-en="Name"></span><input id="name" required autocomplete="name"></label>
    <label><span data-it="Servizio" data-en="Service"></span>
      <select id="service">
        <option data-it="Colore / Balayage" data-en="Color / Balayage"></option>
        <option data-it="Taglio e piega" data-en="Cut &amp; style"></option>
        <option data-it="Uomo" data-en="Men"></option>
        <option data-it="Unghie" data-en="Nails"></option>
      </select>
    </label>
    <label><span data-it="Data preferita" data-en="Preferred date"></span><input id="date" type="date"></label>
    <label><span data-it="Note" data-en="Notes"></span><textarea id="msg" rows="3"></textarea></label>
    <button class="btn" type="submit" data-it="Copia richiesta e chiama" data-en="Copy request and call"></button>
    <p id="status" role="status"></p>
  </form>
</section>
</main>

<footer>
  <span>Prima Donna Hair Beauty &middot; Via Matteo Trucco 196, Roma</span>
  <a href="https://www.instagram.com/prima_donna_hairbeauty/" target="_blank" rel="noopener">Instagram</a>
</footer>
<script src="script.js"></script>
</body>
</html>
